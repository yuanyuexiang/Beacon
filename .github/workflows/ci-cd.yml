name: Beacon CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: beacon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BEACON_TEST_DATABASE_URL: postgresql+psycopg://beacon:ci-only-password@localhost:5432/beacon_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --project apps/api --python 3.12
      - working-directory: apps/api
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy app tests
          uv run --no-sync pytest -o addopts='' -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter beacon-web typecheck
          pnpm --filter beacon-web lint
          pnpm --filter beacon-web test
          pnpm --filter beacon-web build

  providers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [gmail, meta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock
      - run: uv sync --frozen --project "services/$PROVIDER" --python 3.12
        env:
          PROVIDER: ${{ matrix.provider }}
      - run: |
          uv run --no-sync ruff check .
          uv run --no-sync pytest -q
        working-directory: services/${{ matrix.provider }}
        env:
          PROVIDER: ${{ matrix.provider }}

  deployment-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.10.10" }
      - run: uv sync --frozen --project apps/api --python 3.12
      - run: |
          uv run --project apps/api --no-sync python infra/deploy/validate.py
          uv run --project apps/api --no-sync python -m pytest tests/deploy -q
          uv run --project apps/api --no-sync ruff check --config apps/api/pyproject.toml infra/deploy tests/deploy
          uv run --project apps/api --no-sync ruff format --config apps/api/pyproject.toml --check infra/deploy tests/deploy

  images:
    needs: [backend, frontend, providers, deployment-checks]
    if: github.repository == 'yuanyuexiang/Beacon' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: apps/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: gmail, dockerfile: services/gmail/Dockerfile }
          - { name: meta, dockerfile: services/meta/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yuanyuexiang/beacon-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/yuanyuexiang/Beacon
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Write digest manifest
        run: |
          mkdir -p images
          python3 - <<'PYCODE'
          import json, os, pathlib
          name = os.environ['IMAGE_NAME']
          image = 'ghcr.io/yuanyuexiang/beacon-' + name + '@' + os.environ['IMAGE_DIGEST']
          pathlib.Path('images', name + '.json').write_text(json.dumps({'image': image}))
          PYCODE
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: images/${{ matrix.name }}.json
          retention-days: 14
          overwrite: true

  deploy:
    needs: images
    if: github.repository == 'yuanyuexiang/Beacon' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    concurrency:
      group: beacon-test-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Deploy to test server
        id: deploy
        run: python3 infra/deploy/send_release.py
        env:
          DEPLOY_HOST: ${{ vars.BEACON_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.BEACON_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.BEACON_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BEACON_DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify public release
        if: steps.deploy.outputs.verify_release == 'true'
        env:
          BEACON_DOMAIN: ${{ vars.BEACON_DOMAIN }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.request
          for path in ('/healthz', '/api/health'):
              with urllib.request.urlopen('https://' + os.environ['BEACON_DOMAIN'] + path, timeout=30) as response:
                  result = json.load(response)
              assert result['status'] == 'ok' and result['release'] == os.environ['GITHUB_SHA']
          print('Public HTTPS and both release versions verified.')
          PYCODE
