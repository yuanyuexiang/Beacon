# 本地完整部署：postgres + api（自动迁移）+ web。
#   启动：docker compose -f infra/docker-compose.yml up -d --build
#   访问：http://localhost:3000（工作台，/api 已代理到后端）、http://localhost:8000/api/docs
#   测试：docker compose -f infra/docker-compose.yml --profile test run --rm api-test
#   仅数据库（本机开发/测试用）：docker compose -f infra/docker-compose.yml up -d postgres
# 变量来自 infra/.env（见 .env.example）；缺失时用下面的默认值。
services:
  postgres:
    image: postgres:16-alpine
    container_name: beacon-postgres
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
      POSTGRES_DB: beacon
    ports:
      - "5433:5432"
    volumes:
      - beacon-pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: beacon-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@postgres:5432/beacon
      BEACON_DATA_DIR: /data
      BEACON_SECRET_KEY: ${BEACON_SECRET_KEY:-dev-only-secret-key-please-change-0123456789abcdef}
      BEACON_BOOTSTRAP_OPERATOR: ${BEACON_BOOTSTRAP_OPERATOR:-admin}
      BEACON_BOOTSTRAP_PASSWORD: ${BEACON_BOOTSTRAP_PASSWORD:-admin-dev-password}
      BEACON_CHROME_PATH: ""
      BEACON_GMAIL_SERVICE_URL: http://gmail-service:8090
      BEACON_META_SERVICE_URL: http://meta-service:8091
      BEACON_META_SERVICE_TOKEN_FILE: /run/secrets/meta_service_token
      BEACON_GMAIL_SERVICE_TOKEN_FILE: /run/secrets/gmail_service_token
    secrets:
      - gmail_service_token
      - meta_service_token
    ports:
      - "8000:8000"
    volumes:
      - beacon-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        BEACON_API_URL: http://api:8000
    container_name: beacon-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      BEACON_API_URL: http://api:8000
    ports:
      - "3000:3000"

  gmail-service:
    build:
      context: ..
      dockerfile: services/gmail/Dockerfile
    container_name: beacon-gmail
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GMAIL_SERVICE_TOKEN_FILE: /run/secrets/gmail_service_token
      GMAIL_REDIRECT_URI: ${BEACON_GMAIL_REDIRECT_URI:-http://localhost:3000/api/gmail/oauth/callback}
      HTTPS_PROXY: ${BEACON_GMAIL_PROXY:-}
    secrets:
      - gmail_service_token
    volumes:
      - beacon-gmail-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  gmail-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: beacon-gmail-worker
    depends_on:
      api:
        condition: service_healthy
      gmail-service:
        condition: service_healthy
    environment:
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@postgres:5432/beacon
      BEACON_DATA_DIR: /data
      BEACON_SECRET_KEY: ${BEACON_SECRET_KEY:-dev-only-secret-key-please-change-0123456789abcdef}
      BEACON_GMAIL_SERVICE_URL: http://gmail-service:8090
      BEACON_GMAIL_SERVICE_TOKEN_FILE: /run/secrets/gmail_service_token
    secrets:
      - gmail_service_token
    command: ["uv", "run", "--no-sync", "python", "-m", "app.modules.gmail.worker"]
    restart: unless-stopped

  meta-service:
    build:
      context: ..
      dockerfile: services/meta/Dockerfile
    container_name: beacon-meta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      META_SERVICE_TOKEN_FILE: /run/secrets/meta_service_token
      HTTPS_PROXY: ${BEACON_META_PROXY:-}
    secrets:
      - meta_service_token
    volumes:
      - beacon-meta-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  outreach-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: beacon-outreach-worker
    depends_on:
      api:
        condition: service_healthy
      meta-service:
        condition: service_healthy
    environment:
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@postgres:5432/beacon
      BEACON_DATA_DIR: /data
      BEACON_SECRET_KEY: ${BEACON_SECRET_KEY:-dev-only-secret-key-please-change-0123456789abcdef}
      BEACON_META_SERVICE_URL: http://meta-service:8091
      BEACON_META_SERVICE_TOKEN_FILE: /run/secrets/meta_service_token
    secrets:
      - meta_service_token
    command: ["uv", "run", "--no-sync", "python", "-m", "app.modules.outreach.worker"]
    restart: unless-stopped

  directory-worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: beacon-directory-worker
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@postgres:5432/beacon
      BEACON_DATA_DIR: /data
      BEACON_SECRET_KEY: ${BEACON_SECRET_KEY:-dev-only-secret-key-please-change-0123456789abcdef}
    command: ["python", "-m", "app.modules.directory.worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time;assert time.time()-pathlib.Path('/tmp/directory-heartbeat').stat().st_mtime < 90"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # 在容器里跑后端测试（使用同一 postgres 的 beacon_test 库）
  api-test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: base
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BEACON_TEST_DATABASE_URL: postgresql+psycopg://beacon:beacon@postgres:5432/beacon_test
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@postgres:5432/beacon_test
      BEACON_DATA_DIR: /tmp/beacon-test-data
      BEACON_SECRET_KEY: test-secret-key-0123456789abcdef0123456789abcdef
    command: ["sh", "-c", "uv sync --frozen && uv run pytest -q"]

volumes:
  beacon-pgdata:
  beacon-data:
  beacon-gmail-data:
  beacon-meta-data:

secrets:
  gmail_service_token:
    file: ./secrets/gmail-service-token
  meta_service_token:
    file: ./secrets/meta-service-token
